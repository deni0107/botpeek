name: Release

# Push a tag like v0.1.0 to build, package and publish a GitHub Release.
# Run manually to get downloadable build artifacts without publishing.
#
# Optional repository secrets for a signed and notarized build:
#   MACOS_CERTIFICATE_P12_BASE64  base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   DEVELOPER_ID_APPLICATION      identity name, e.g. "Developer ID Application: Jane Doe (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD   for notarytool
# Without them the app is ad-hoc signed and the release notes say so.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            test "$VERSION" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION file ($(cat VERSION))"; exit 1; }
          else
            VERSION="$(cat VERSION)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured; the build will be ad-hoc signed."
            exit 0
          fi
          # A signed build that isn't notarized is still blocked by Gatekeeper,
          # and the release notes would wrongly call it ready to open.
          for name in P12_PASSWORD DEVELOPER_ID_APPLICATION APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::A signing certificate is set but secret $name is missing."; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOPER_ID_APPLICATION: ${{ steps.signing.outputs.signed == 'true' && secrets.DEVELOPER_ID_APPLICATION || '' }}
        run: ./scripts/build-app.sh

      - name: Package, notarize and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEVELOPER_ID_APPLICATION: ${{ steps.signing.outputs.signed == 'true' && secrets.DEVELOPER_ID_APPLICATION || '' }}
          APPLE_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./scripts/package.sh

      - name: Smoke test
        run: dist/BotPeek.app/Contents/MacOS/BotPeek --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BotPeek-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  intel-smoke:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: BotPeek-${{ needs.build.outputs.version }}
      - run: |
          ditto -x -k BotPeek-*.zip .
          BotPeek.app/Contents/MacOS/BotPeek --version

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, intel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: BotPeek-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Write release notes
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          cp .github/release-notes.md notes.md
          if [[ "$SIGNED" != "true" ]]; then
            cat .github/release-notes-unsigned.md >> notes.md
          fi
          printf '\n### SHA-256\n```\n%s\n```\n' "$(cat release-assets/SHA256SUMS.txt)" >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --latest \
            --title "BotPeek $GITHUB_REF_NAME (beta)" \
            --notes-file notes.md
