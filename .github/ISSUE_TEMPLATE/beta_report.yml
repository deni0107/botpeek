name: Beta test report
description: Results from testing BotPeek on a real Mac (see docs/BETA_TESTING.md)
labels: [beta-test]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing! Follow the plan in [docs/BETA_TESTING.md](https://github.com/deni0107/botpeek/blob/main/docs/BETA_TESTING.md).
        Mark items ✅ works, ❌ broken, ➖ not tested. Remove private information from screenshots.
  - type: input
    id: versions
    attributes:
      label: Setup
      description: BotPeek version, macOS version, Mac model (Apple silicon / Intel), Grok Bot version, number of displays
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Installation
      description: Did the DMG open? What did Gatekeeper show? Did "Open Anyway" work?
  - type: textarea
    id: demo
    attributes:
      label: A. Demo mode results
      value: |
        - Character appears with DEMO badge:
        - Click-through around the character:
        - Choice reply + celebration:
        - Text reply / #fail error:
        - Approval (default and inline):
        - Queue, snooze, dismiss:
        - Unread bots never appear:
        - Edges, sizes, animation levels, reduce motion:
        - Light/dark, multiple displays, full screen, Spaces:
        - Focus stays in / returns to my app:
  - type: textarea
    id: live
    attributes:
      label: B. Real Grok Bot results
      value: |
        - Connection status and bot count correct:
        - Avatars match (please attach a comparison screenshot):
        - Character appears when a bot asks a question (delay?):
        - No popups for progress / unread / finished:
        - Full question and choices shown (with Accessibility):
        - Multiple-choice answer reached the right bot:
        - Text reply reached the right conversation; clipboard and focus restored:
        - Answering in Grok Bot dismisses the character:
        - Two bots at once:
        - Sleep/wake, restarting Grok Bot and BotPeek:
  - type: textarea
    id: check
    attributes:
      label: Output of BotPeek --check
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (feel, animation, design)
      description: Attach diagnostics (menu bar → Export Diagnostics…) and screenshots or a screen recording.
